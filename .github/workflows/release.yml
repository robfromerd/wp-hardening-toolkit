name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run quality gates
        run: composer check
      - name: Verify tag matches plugin version
        run: |
          plugin_version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]Version:[[:space:]]*([^[:space:]]+).*/\1/p' wp-hardening-toolkit.php | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${plugin_version}"
      - name: Build installable plugin
        run: composer build -- "${GITHUB_REF_NAME}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "WP Hardening Toolkit ${GITHUB_REF_NAME}"
